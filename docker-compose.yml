x-app-environment: &app-environment
  INTERNAL_API_URL: http://api:8000
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  REDIS_URL: redis://redis:6379/0
  GOOGLE_SERVICE_ACCOUNT_FILE: /run/secrets/google-service-account.json
  GOOGLE_OAUTH_CLIENT_FILE: /run/secrets/google-oauth-client.json
  GOOGLE_OAUTH_TOKEN_FILE: /run/secrets/google-oauth-token.json

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ragbot}
      POSTGRES_USER: ${POSTGRES_USER:-ragbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ragbot} -d ${POSTGRES_DB:-ragbot}"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      target: runtime
    env_file: ${ENV_FILE:-.env}
    environment: *app-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: .
      target: embeddings
    env_file: ${ENV_FILE:-.env}
    environment: *app-environment
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./credentials:/run/secrets:ro
      - model_cache:/home/app/.cache
  bot:
    build:
      context: .
      target: runtime
    env_file: ${ENV_FILE:-.env}
    environment: *app-environment
    command: ["python", "-m", "app.bot.app"]
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./credentials:/run/secrets:ro
  worker:
    build:
      context: .
      target: embeddings
    env_file: ${ENV_FILE:-.env}
    environment: *app-environment
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "worker", "--loglevel=INFO"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./credentials:/run/secrets:ro
      - ./credentials/google-oauth-token.json:/run/secrets/google-oauth-token.json
      - model_cache:/home/app/.cache
  ocr-worker:
    profiles: ["ocr"]
    build:
      context: .
      target: ocr
    env_file: ${ENV_FILE:-.env}
    environment: *app-environment
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "worker", "--loglevel=INFO", "--queues=ocr"]
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./credentials:/run/secrets:ro
      - ./credentials/google-oauth-token.json:/run/secrets/google-oauth-token.json
      - model_cache:/home/app/.cache

volumes:
  postgres_data:
  redis_data:
  model_cache:
